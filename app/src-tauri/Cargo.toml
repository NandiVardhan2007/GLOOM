[package]
name = "jarvis"
version = "1.3.0"
description = "JARVIS: Pixel-Perfect Dynamic Island & Notch for Windows"
authors = ["JARVIS Team"]
edition = "2021"

[features]
# Production builds must embed the compiled frontend instead of loading devUrl.
# Build releases with `--features custom-protocol` (the Tauri CLI does this too).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[target.'cfg(windows)'.dependencies]
windows-future = "0.3.2"
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Local iteration profile: no LTO, parallel codegen, incremental linking.
# CI/releases keep the optimized `release` profile above.
[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
panic = "unwind"
