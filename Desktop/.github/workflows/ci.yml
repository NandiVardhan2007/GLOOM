name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-linux:
    name: Test Linux (Ubuntu / Zorin)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Desktop/package.json

      - name: Install and test frontend
        working-directory: Desktop
        run: |
          npm ci
          npm test
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri

      - name: Check Rust (Linux)
        run: cargo check --manifest-path Desktop/src-tauri/Cargo.toml

      - name: Run Rust tests (Linux)
        run: cargo test --manifest-path Desktop/src-tauri/Cargo.toml

  test-windows:
    name: Test Windows 11/10
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Desktop/package.json

      - name: Install and test frontend
        working-directory: Desktop
        run: |
          npm ci
          npm test
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri

      - name: Check Rust (Windows)
        run: cargo check --manifest-path Desktop/src-tauri/Cargo.toml
