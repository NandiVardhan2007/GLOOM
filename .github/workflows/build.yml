name: Build JARVIS Ecosystem (Android APK & Windows EXE)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'Doc.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════
  # 1. ANDROID DYNAMIC ISLAND RELEASE APK BUILD
  # ══════════════════════════════════════════════════════════════
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Android Release Keystore
        run: |
          mkdir -p mobile/android/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using configured GitHub Secret KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mobile/android/keystore/release.jks
          else
            echo "Using canonical JARVIS Ecosystem release keystore..."
            echo "" | base64 -d > mobile/android/keystore/release.jks
          fi

      - name: Accept Android SDK Licenses
        run: |
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x mobile/android/gradlew

      - name: Build Android Release APK
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'jarvis_island_release_key' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'jarvis_release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'jarvis_island_release_key' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          cp mobile/android/app/build/outputs/apk/release/*.apk build-artifacts/JARVIS-Island-Release-v1.0.apk

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Island-Android-Release-APK
          path: build-artifacts/JARVIS-Island-Release-v1.0.apk
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # 2. WINDOWS DYNAMIC ISLAND EXE BUILD
  # ══════════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Node Dependencies
        working-directory: app
        run: npm install

      - name: Build Desktop Frontend (Vite)
        working-directory: app
        run: npm run build

      - name: Compile Windows Tauri Desktop Binary (Release)
        run: cargo build --release --manifest-path app/src-tauri/Cargo.toml

      - name: Prepare Windows Executable Artifact
        run: |
          New-Item -ItemType Directory -Path build-artifacts -Force
          Copy-Item app/src-tauri/target/release/jarvis.exe build-artifacts/JARVIS-Island-Windows.exe -Force

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Island-Windows-Desktop-EXE
          path: build-artifacts/JARVIS-Island-Windows.exe
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # 3. PUBLISH GITHUB RELEASE (APK & EXE WITH TAG)
  # ══════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Island-Android-Release-APK
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Island-Windows-Desktop-EXE
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('JARVIS Dynamic Island Release {0}', github.ref_name) || format('JARVIS Dynamic Island Release v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/**/JARVIS-Island-Release-v1.0.apk
            release-assets/**/JARVIS-Island-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
