name: Build & Release GLOOM (Windows Dedicated Installer)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'Doc.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════
  # 1. WINDOWS DYNAMIC ISLAND EXE & CUSTOM INSTALLER BUILD
  # ══════════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows Desktop App & Custom Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Desktop/src-tauri
            installer-app/src-tauri

      - name: Install Desktop Node Dependencies
        working-directory: Desktop
        run: npm ci

      - name: Stamp Release Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "2.8.${env:GITHUB_RUN_NUMBER}"
          }
          python scripts/stamp_version.py "$version"

      - name: Verify Main App Cargo Check & Tests
        run: |
          cargo check --manifest-path Desktop/src-tauri/Cargo.toml
          cargo test --manifest-path Desktop/src-tauri/Cargo.toml
          npm --prefix Desktop test

      - name: Compile Main GLOOM Binary (Embedded Production Bundle)
        working-directory: Desktop
        run: npm run tauri build -- --no-bundle

      - name: Package Installer Payload
        shell: pwsh
        run: |
          $exe = "Desktop/src-tauri/target/release/gloom.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected main application binary not found at $exe"
          }
          Compress-Archive -Path $exe -DestinationPath "installer-app/src-tauri/payload.zip" -Force
          $size = (Get-Item "installer-app/src-tauri/payload.zip").Length / 1MB
          Write-Host "Compressed payload: $([Math]::Round($size, 2)) MB"

      - name: Install Custom Installer Dependencies
        working-directory: installer-app
        run: npm ci

      - name: Verify Installer Tests
        run: cargo test --manifest-path installer-app/src-tauri/Cargo.toml

      - name: Compile Custom GLOOM Installer App (Embedded Webview Wizard)
        working-directory: installer-app
        run: npm run tauri build -- --no-bundle

      - name: Stage Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-artifacts -Force
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            $tag = $env:GITHUB_REF_NAME
          } else {
            $version = "2.8.$env:GITHUB_RUN_NUMBER"
            $tag = "v$version"
          }

          $installerSrc = "installer-app/src-tauri/target/release/gloom-installer.exe"
          $mainExe = "Desktop/src-tauri/target/release/gloom.exe"

          # 1. Custom Setup Installer (with version and alias)
          Copy-Item $installerSrc -Destination "build-artifacts/GLOOM-Setup-$version.exe" -Force
          Copy-Item $installerSrc -Destination "build-artifacts/GLOOM-Setup.exe" -Force

          # 2. Portable Windows Zip
          Compress-Archive -Path $mainExe -DestinationPath "build-artifacts/gloom-$version-portable-windows-x64.zip" -Force

          # 3. Checksums
          $hashVersioned = (Get-FileHash -Algorithm SHA256 -Path "build-artifacts/GLOOM-Setup-$version.exe").Hash.ToLower()
          "$hashVersioned  GLOOM-Setup-$version.exe" | Out-File -FilePath "build-artifacts/GLOOM-Setup-$version.exe.sha256" -Encoding ascii

          $hashAlias = (Get-FileHash -Algorithm SHA256 -Path "build-artifacts/GLOOM-Setup.exe").Hash.ToLower()
          "$hashAlias  GLOOM-Setup.exe" | Out-File -FilePath "build-artifacts/GLOOM-Setup.exe.sha256" -Encoding ascii

          # 4. Updater Manifest
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = @{
            version = $tag
            notes = "GLOOM Dynamic Island Release $tag"
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/NandiVardhan2007/GLOOM/releases/download/$tag/GLOOM-Setup-$version.exe"
              }
            }
          } | ConvertTo-Json -Depth 5
          $manifest | Out-File -FilePath build-artifacts/latest.json -Encoding utf8

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GLOOM-Windows-Release
          path: |
            build-artifacts/GLOOM-Setup-*.exe
            build-artifacts/GLOOM-Setup.exe
            build-artifacts/*.zip
            build-artifacts/*.sha256
            build-artifacts/latest.json
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # 2. PUBLISH GITHUB RELEASE (WINDOWS DEDICATED)
  # ══════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: GLOOM-Windows-Release
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.8.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('GLOOM Dynamic Island Release {0}', github.ref_name) || format('GLOOM Dynamic Island Release v2.8.{0}', github.run_number) }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### GLOOM ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.8.0' }} — Dedicated Windows Companion Suite

            #### 🔄 Resilient In-App GitHub Releases Auto-Updater Engine
            - **Signature-Free Native Updates**: Queries GitHub Releases API directly with raw manifest fallback.
            - **Chunk Streaming Progress**: Real-time download progress bar in settings and notch.
            - **Detached Auto-Install**: Spawns `GLOOM-Setup.exe --auto-install` with Windows breakaway flags (`CREATE_BREAKAWAY_FROM_JOB`) for seamless update and automatic restart.

            #### 📋 Native Win32 Clipboard History
            - **High-Performance Win32 Monitor**: Real-time clipboard tracking via `GetClipboardSequenceNumber` and `CF_UNICODETEXT`.
            - **Deduplication & LRU Cache**: 100-item local history ring buffer with disk persistence.
            - **Productivity Drawer UI**: Dedicated "Clips" tab with search, copy action with checkmark animation, and one-click clear.

            #### 🔔 Windows Toast Notification Receiver
            - **WinRT UserNotificationListener**: Intercepts Windows 10/11 system notifications in the background.
            - **Dynamic Island Live Banner**: Automatically expands the notch with vibrating bell icon, app label, and notification text with click-to-dismiss.

            #### 🤖 AI Agent Live Progress & Working Telemetry
            - **Real-Time Step Counters**: Live `[step/total_steps]` indicator in the collapsed dynamic island.
            - **Rich Progress Card**: Active tool badges with pulsating indicators, formatted token counts, elapsed timers, and dynamic linear progress bars.

            #### 🏝️ Custom Dark Glass Setup Wizard (`GLOOM-Setup.exe`)
            - **Self-Contained Installer App**: Custom webview installation UI with dark glass backdrop blur, animated vector logo, real-time extraction progress bar, elevation handling, desktop shortcuts, and uninstall registry registration.
            - **No Localhost Dependency**: Embedded production webview bundle directly into the Windows PE binary (`tauri build --no-bundle`), completely resolving `localhost refused to connect` / `ERR_CONNECTION_REFUSED`.

            #### 🎨 100% GLOOM Standalone Branding
            - Pure vector rendering with `assets/logo.svg` across all surfaces.
            - Fully purged all external project artifacts, duplicate READMEs, and watermarks.
          generate_release_notes: true
          files: |
            release-assets/**/GLOOM-Setup-*.exe
            release-assets/**/GLOOM-Setup.exe
            release-assets/**/*.zip
            release-assets/**/*.sha256
            release-assets/**/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
