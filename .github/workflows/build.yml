name: Build JARVIS Ecosystem (Android APK & Windows EXE)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'Doc.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════
  # 1. ANDROID DYNAMIC ISLAND RELEASE APK BUILD
  # ══════════════════════════════════════════════════════════════
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stamp Release Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          python scripts/stamp_version.py "$VERSION" "${GITHUB_RUN_NUMBER}"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p mobile/android/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using configured repository Secret KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > mobile/android/keystore/release.jks
          else
            echo "::error::KEYSTORE_BASE64 secret is not configured in repository settings. Release build failed safely."
            exit 1
          fi

      - name: Accept Android SDK Licenses
        run: |
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x mobile/android/gradlew

      - name: Run Android Unit Tests
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Android Release APK
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          cp mobile/android/app/build/outputs/apk/release/*.apk build-artifacts/JARVIS-Island-Release-v1.0.apk
          cd build-artifacts
          sha256sum JARVIS-Island-Release-v1.0.apk > JARVIS-Island-Release-v1.0.apk.sha256

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Island-Android-Release-APK
          path: |
            build-artifacts/JARVIS-Island-Release-v1.0.apk
            build-artifacts/JARVIS-Island-Release-v1.0.apk.sha256
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # 2. WINDOWS DYNAMIC ISLAND EXE BUILD
  # ══════════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Node Dependencies
        working-directory: app
        run: npm ci

      - name: Stamp Release Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          python scripts/stamp_version.py $version $env:GITHUB_RUN_NUMBER

      - name: Build Desktop Frontend (Vite)
        working-directory: app
        run: npm run build

      - name: Run Protocol Schema Tests (self-contained plain Python)
        run: python -m unittest discover -s tests -p "*_test.py"

      - name: Run Cargo Tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      - name: Compile Windows Tauri Desktop Binary (Release)
        run: cargo build --release --manifest-path app/src-tauri/Cargo.toml

      - name: Prepare Windows Executable Artifact
        run: |
          New-Item -ItemType Directory -Path build-artifacts -Force
          Copy-Item app/src-tauri/target/release/jarvis.exe build-artifacts/JARVIS-Island-Windows.exe -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path build-artifacts/JARVIS-Island-Windows.exe).Hash.ToLower()
          "$hash  JARVIS-Island-Windows.exe" | Out-File -FilePath build-artifacts/JARVIS-Island-Windows.exe.sha256 -Encoding ascii

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Island-Windows-Desktop-EXE
          path: |
            build-artifacts/JARVIS-Island-Windows.exe
            build-artifacts/JARVIS-Island-Windows.exe.sha256
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # 3. PUBLISH GITHUB RELEASE (APK & EXE WITH TAG)
  # ══════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Island-Android-Release-APK
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: JARVIS-Island-Windows-Desktop-EXE
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('JARVIS Dynamic Island Release {0}', github.ref_name) || format('JARVIS Dynamic Island Release v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/**/JARVIS-Island-Release-v1.0.apk
            release-assets/**/JARVIS-Island-Release-v1.0.apk.sha256
            release-assets/**/JARVIS-Island-Windows.exe
            release-assets/**/JARVIS-Island-Windows.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
