name: Build & Release GLOOM (Windows Dedicated Installer)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'Doc.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════
  # 1. WINDOWS DYNAMIC ISLAND EXE BUILD
  # ══════════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Desktop/package.json

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri

      - name: Install Node Dependencies
        working-directory: Desktop
        run: npm ci

      - name: Stamp Release Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "2.7.${env:GITHUB_RUN_NUMBER}"
          }
          python scripts/stamp_version.py "$version"

      - name: Build Webview Frontend
        working-directory: Desktop
        run: npm run build

      - name: Verify Cargo Check & Compile Windows Test Suite
        run: |
          cargo check --manifest-path Desktop/src-tauri/Cargo.toml
          cargo test --manifest-path Desktop/src-tauri/Cargo.toml

      - name: Compile Windows Tauri Desktop Binary (Release)
        run: cargo build --release --manifest-path Desktop/src-tauri/Cargo.toml

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Windows Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-artifacts -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/gloom.iss
          $hash = (Get-FileHash -Algorithm SHA256 -Path build-artifacts/GLOOM-Island-Setup.exe).Hash.ToLower()
          "$hash  GLOOM-Island-Setup.exe" | Out-File -FilePath build-artifacts/GLOOM-Island-Setup.exe.sha256 -Encoding ascii
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v2.7.$env:GITHUB_RUN_NUMBER"
          }
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = @{
            version = $tag
            notes = "GLOOM Dynamic Island Release $tag"
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/NandiVardhan2007/GLOOM/releases/download/$tag/GLOOM-Island-Setup.exe"
              }
            }
          } | ConvertTo-Json -Depth 5
          $manifest | Out-File -FilePath build-artifacts/latest.json -Encoding utf8

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GLOOM-Island-Windows-Release
          path: |
            build-artifacts/GLOOM-Island-Setup.exe
            build-artifacts/GLOOM-Island-Setup.exe.sha256
            build-artifacts/latest.json
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # 2. PUBLISH GITHUB RELEASE (WINDOWS DEDICATED INSTALLER)
  # ══════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: GLOOM-Island-Windows-Release
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.7.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('GLOOM Dynamic Island Release {0}', github.ref_name) || format('GLOOM Dynamic Island Release v2.7.{0}', github.run_number) }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### GLOOM v2.7.0 — Pure 1:1 Parity Clone, On-Demand Acrylic Windows & Exclusive Vector SVG Branding

            #### 🏝️ Pure 1:1 Parity Dynamic Island & Fluid Dock
            - **Complete Parity**: Ported all on-demand acrylic windows (`Calendar.tsx`, `Settings.tsx` with all 11 tabs, `Dock.tsx`, `Overlay.tsx`), all 14 dynamic notch components, and 34 Rust backend services.
            - **100% Rebranded**: Cleanly rebranded to GLOOM with zero references to old names across code, configs, and 7 localized languages.

            #### 🪟 On-Demand Acrylic Windows & Calendar Sync
            - **Calendar Window (`calendar.html`)**: Native CalDAV and ICS calendar synchronization with Windows Credential Manager integration.
            - **Settings Window (`settings.html`)**: Full 11-tab settings suite with real-time fuzzy search engine and instant deep linking.
            - **Dock Window (`dock.html`)**: macOS-style fluid continuous magnification dock.
            - **Overlay Window (`overlay.html`)**: Full-screen dynamic overlay canvas.

            #### 🎨 Exclusive Vector SVG Branding & Dual-Theme Contrast
            - **100% Vector SVG**: Pure vector rendering using `assets/logo.svg` across all surfaces.
            - **Dual-Theme Adaptation**: Automatically displays dark vector icon (`assets/logo-dark.svg` / `/gloom-dark.svg`) on light backgrounds and light vector icon (`/gloom.svg`) on dark/black OLED backgrounds.
            - **Native Windows Icons**: Regenerated Windows PE `.ico`, taskbar icons, and installer graphics.

            #### 📦 Dedicated Windows Setup Wizard
            - **Windows Dedicated Setup Wizard**: `GLOOM-Island-Setup.exe` packaged via Inno Setup with automatic start menu integration, desktop shortcuts, uninstaller, and silent auto-update pipeline.
          generate_release_notes: true
          files: |
            release-assets/**/GLOOM-Island-Setup.exe
            release-assets/**/GLOOM-Island-Setup.exe.sha256
            release-assets/**/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
