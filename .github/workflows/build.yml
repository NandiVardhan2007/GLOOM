name: Build & Release GLOOM (Windows & Linux Dedicated Installers)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'Doc.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════
  # 1. WINDOWS DYNAMIC ISLAND EXE BUILD
  # ══════════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Desktop/package.json

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri

      - name: Install Node Dependencies
        working-directory: Desktop
        run: npm ci

      - name: Stamp Release Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "2.3.${env:GITHUB_RUN_NUMBER}"
          }
          python scripts/stamp_version.py "$version"

      - name: Build Webview Frontend
        working-directory: Desktop
        run: npm run build

      - name: Verify Cargo Check & Compile Windows Test Suite
        run: |
          cargo check --locked --manifest-path Desktop/src-tauri/Cargo.toml
          cargo test --manifest-path Desktop/src-tauri/Cargo.toml

      - name: Compile Windows Tauri Desktop Binary (Release)
        run: cargo build --release --manifest-path Desktop/src-tauri/Cargo.toml

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Windows Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-artifacts -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/gloom.iss
          $hash = (Get-FileHash -Algorithm SHA256 -Path build-artifacts/GLOOM-Island-Setup.exe).Hash.ToLower()
          "$hash  GLOOM-Island-Setup.exe" | Out-File -FilePath build-artifacts/GLOOM-Island-Setup.exe.sha256 -Encoding ascii
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v2.3.$env:GITHUB_RUN_NUMBER"
          }
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = @{
            version = $tag
            notes = "GLOOM Dynamic Island Release $tag"
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/NandiVardhan2007/GLOOM/releases/download/$tag/GLOOM-Island-Setup.exe"
              }
            }
          } | ConvertTo-Json -Depth 5
          $manifest | Out-File -FilePath build-artifacts/latest.json -Encoding utf8

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GLOOM-Island-Windows-Release
          path: |
            build-artifacts/GLOOM-Island-Setup.exe
            build-artifacts/GLOOM-Island-Setup.exe.sha256
            build-artifacts/latest.json
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # 2. LINUX DYNAMIC ISLAND DEDICATED PACKAGE (.DEB)
  # ══════════════════════════════════════════════════════════════
  build-linux:
    name: Build Linux Desktop Package (DEB)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Desktop/package.json

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri

      - name: Install Node Dependencies
        working-directory: Desktop
        run: npm ci

      - name: Stamp Release Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="2.3.${GITHUB_RUN_NUMBER}"
          fi
          python scripts/stamp_version.py "$VERSION"
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run Frontend Tests & Build
        working-directory: Desktop
        run: |
          npm test
          npm run build

      - name: Compile Linux Tauri Release Binary
        run: cargo build --release --manifest-path Desktop/src-tauri/Cargo.toml

      - name: Package Linux Dedicated .deb Installer
        run: |
          mkdir -p build-artifacts
          VERSION="${RELEASE_VERSION:-2.3.1}"

          # Native Debian / Ubuntu / Zorin OS Package (.deb)
          DEB_DIR="deb-package"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/32x32/apps"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/64x64/apps"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$DEB_DIR/usr/share/pixmaps"
          mkdir -p "$DEB_DIR/DEBIAN"

          cp Desktop/src-tauri/target/release/gloom "$DEB_DIR/usr/bin/gloom"
          chmod 755 "$DEB_DIR/usr/bin/gloom"

          cp Desktop/src-tauri/icons/32x32.png "$DEB_DIR/usr/share/icons/hicolor/32x32/apps/gloom.png"
          cp Desktop/src-tauri/icons/64x64.png "$DEB_DIR/usr/share/icons/hicolor/64x64/apps/gloom.png"
          cp Desktop/src-tauri/icons/128x128.png "$DEB_DIR/usr/share/icons/hicolor/128x128/apps/gloom.png"
          cp Desktop/src-tauri/icons/256x256.png "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/gloom.png"
          cp Desktop/src-tauri/icons/512x512.png "$DEB_DIR/usr/share/icons/hicolor/512x512/apps/gloom.png"
          cp Desktop/src-tauri/icons/512x512.png "$DEB_DIR/usr/share/pixmaps/gloom.png"

          cat << 'EOF' > "$DEB_DIR/DEBIAN/postinst"
          #!/bin/sh
          set -e
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF
          chmod 755 "$DEB_DIR/DEBIAN/postinst"

          cat << 'EOF' > "$DEB_DIR/DEBIAN/postrm"
          #!/bin/sh
          set -e
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          exit 0
          EOF
          chmod 755 "$DEB_DIR/DEBIAN/postrm"

          cat << EOF > "$DEB_DIR/DEBIAN/control"
          Package: gloom
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Nandu Vardhan <nanduvardhan@users.noreply.github.com>
          Depends: libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1
          Description: Next-Generation Dynamic Island & Fluid Dock for Linux
           GLOOM is a glanceable activity surface and fluid island overlay
           crafted with Apple HIG design, smooth spring physics, and media controls.
          EOF

          cat << 'EOF' > "$DEB_DIR/usr/share/applications/com.nandu.gloom.desktop"
          [Desktop Entry]
          Name=GLOOM
          Comment=Next-Generation Dynamic Island & Fluid Dock for Linux
          Exec=/usr/bin/gloom
          Icon=gloom
          Terminal=false
          Type=Application
          Categories=Utility;
          StartupWMClass=GLOOM
          EOF

          chmod 644 "$DEB_DIR/DEBIAN/control"
          chmod 644 "$DEB_DIR/usr/share/applications/com.nandu.gloom.desktop"

          dpkg-deb --build "$DEB_DIR" "build-artifacts/gloom_${VERSION}_amd64.deb"
          cd build-artifacts
          sha256sum "gloom_${VERSION}_amd64.deb" > "gloom_${VERSION}_amd64.deb.sha256"
          cd ..

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GLOOM-Island-Linux-Release
          path: |
            build-artifacts/*.deb
            build-artifacts/*.deb.sha256
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # 3. PUBLISH GITHUB RELEASE (WINDOWS & LINUX DEDICATED INSTALLERS)
  # ══════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: GLOOM-Island-Windows-Release
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: GLOOM-Island-Linux-Release
          path: release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.3.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('GLOOM Dynamic Island Release {0}', github.ref_name) || format('GLOOM Dynamic Island Release v2.3.{0}', github.run_number) }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### GLOOM 2.3.1 — Multi-Platform Dynamic Island (Windows & Linux Dedicated Installers)

            #### 🍏 Apple iOS 18 Design & HIG Engineering
            - **Pure OLED Black & Specular Glass Materials**: Pure `#000000` foundation with 40px backdrop blur, saturation boost, and Apple specular micro-rim illumination.
            - **Unified Harmonic Springs**: Synchronized spring physics (`stiffness: 380, damping: 32, mass: 0.8`) with instant pointer-down tap feedback (`whileTap={{ scale: 0.97 }}`).
            - **Seamless Floating Pill & Flush Notch Switching**: Instantaneous toggling between Floating Pill and Bezel Notch geometries with C1-continuous shoulder flares.
            - **Phosphor Lime Audio Waveform**: Ambient-reactive audio visualizer bars streaming frequency waveforms with glowing green gradients (`#30D158` to `#34C759`).
            - **SF Pro Tabular Numerals**: Optical letter-spacing and tabular numbers on clocks, countdown timers, and track scrubbers.
            - **Intuitive Island Interaction**: Click capsule to expand, click header to toggle closed, click backdrop or press <kbd>Esc</kbd> to dismiss. Zero accidental collapses during hover.

            #### 📦 Dedicated Native Installers
            - **Windows Dedicated Setup Wizard**: `GLOOM-Island-Setup.exe` packaged via Inno Setup with automatic start menu integration, desktop shortcuts, uninstaller, and silent update pipeline.
            - **Linux Native Package**: `gloom_*_amd64.deb` native Debian/Ubuntu/Zorin OS package with system desktop launcher entry, hicolor icon registration, and standard package manager integration.

            ---
            *Android companion app and LiveBridge have been retired in favor of a hyper-focused desktop experience.*
          generate_release_notes: true
          files: |
            release-assets/**/GLOOM-Island-Setup.exe
            release-assets/**/GLOOM-Island-Setup.exe.sha256
            release-assets/**/*.deb
            release-assets/**/*.deb.sha256
            release-assets/**/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
