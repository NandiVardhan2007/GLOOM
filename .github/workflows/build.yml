name: Build JARVIS Ecosystem (Android APK & Windows EXE)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'Doc.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════
  # 1. ANDROID DYNAMIC ISLAND APK BUILD
  # ══════════════════════════════════════════════════════════════
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x mobile/android/gradlew

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          cp mobile/android/app/build/outputs/apk/debug/*.apk build-artifacts/JARVIS-Island-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Island-Android-APK
          path: build-artifacts/JARVIS-Island-Android.apk
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # 2. WINDOWS DYNAMIC ISLAND EXE BUILD
  # ══════════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Node Dependencies
        working-directory: app
        run: npm install

      - name: Build Desktop Frontend (Vite)
        working-directory: app
        run: npm run build

      - name: Compile Windows Tauri Desktop Binary (Release)
        run: cargo build --release --manifest-path app/src-tauri/Cargo.toml

      - name: Prepare Windows Executable Artifact
        run: |
          New-Item -ItemType Directory -Path build-artifacts -Force
          Copy-Item app/src-tauri/target/release/jarvis.exe build-artifacts/JARVIS-Island-Windows.exe -Force

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Island-Windows-Desktop-EXE
          path: build-artifacts/JARVIS-Island-Windows.exe
          retention-days: 14
